<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Checkout - Good Chat</title>
    <script src="https://js.stripe.com/v3/"></script>
    <link rel="stylesheet" href="styles/global.css">
</head>
<body>
    <div id="stripe-checkout-container">
        <div style="text-align: center; padding: 50px;">
            <div style="display: inline-block; width: 50px; height: 50px; border: 3px solid #667eea; border-top: 3px solid transparent; border-radius: 50%; animation: spin 1s linear infinite;"></div>
            <p>Loading secure checkout...</p>
        </div>
    </div>

    <script src="/src/components/StripeCheckout.js"></script>
    
    <style>
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</body>
</html>
